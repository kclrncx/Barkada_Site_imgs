<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>

<body bgcolor="#fde9b2">
    <center>
        <header>
            <img src="https://www.ctu.edu.ph/daanbantayan/wp-content/uploads/sites/43/2021/06/dannbantayan.png" alt="CTU_DB">
            <hr>
            <h1>
                CTU DAABANTAYAN
            </h1>

            <h3>
                <p>Student Services and Information</p>
            </h3>
            <hr>
        </header><br><br>

        <main id="login">
            <h1>
                <form action="https://kclrncx.github.io/Barkada_Site_imgs/htmls/dashboard.html">
                    <label>
                        <br>
                        Student Name:
                        <input type="text" placeholder="Enter Fullname" required>
                    </label>
                    <br><br>
                    <label>
                        <br>
                        Student Birthdate:
                        <input type="date" placeholder="Enter Birtdate" required>
                    </label>
                    <br><br>
                    <label>
                        <br>
                        Student ID:
                        <input type="text" placeholder="Enter ID" maxlength="7" required>
                    </label>
                    <br><br>
                    <label>
                        <select name="Program" placeholder="Program" required>
                            <option value="">Select Program</option>
                            <option value="BSFI">Bachelor of Science in Fisheries</option>
                            <option value="CoEd">College of Education</option>
                            <option value="BSHM">Bachelor of Science in Hospitality Management</option>
                            <option value="BIT">Bachelor of Industrial Technology</option>
                            <option value="BSIT">Bachelor of Sceice in Information Technology</option>
                            <option value="BSIE">Bachelor of Science in Industrial Engineering</option>
                        </select>
                    </label>
                    <label>
                        <select name="year_section" placeholder="Year & Section" required>
                            <option value="">Select Year & Section</option>
                            <option value="1A">1A</option>
                            <option value="1B">1B</option>
                            <option value="1C">1C</option>
                            <option value="1D">1D</option>
                            <option value="1E">1E</option>

                            <option value="2A">2A</option>
                            <option value="2B">2B</option>
                            <option value="2C">2C</option>
                            <option value="2D">2D</option>
                            <option value="2E">2E</option>

                            <option value="3A">3A</option>
                            <option value="3B">3B</option>
                            <option value="3C">3C</option>
                            <option value="3D">3D</option>
                            <option value="3E">3E</option>

                            <option value="4A">4A</option>
                            <option value="4B">4B</option>
                            <option value="4C">4C</option>
                            <option value="4D">4D</option>
                            <option value="4E">4E</option>
                        </select>
                        <br><br>

                        <button type="submit">Login</button>

                    </label>
                </form>
            </h1>
        </main><br><br><br>
        <hr>

        <footer>
            <font size="2">
                <h2>CTU DAABANTAYAN</h2>

                <p>Student Services and Information Center</p>

                <p>Daantabayan Campus, Cebu, Philippines</p>

                <p>Email: studentservices@gmail.com</p>

                <p>Office Hours: Monday - Friday, 8:00 AM - 5:00 PM</p>

                <p>&copy; 2026 CTU Daantabayan. All Rights Reserved.</p>
            </font>
        </footer>

    </center>
</body>

</html>
